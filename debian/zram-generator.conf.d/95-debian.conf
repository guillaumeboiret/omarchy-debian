# Overrides zram-size from 90-omarchy.conf, which sizes the device to RAM.
# A 16G laptop running many mostly-idle node processes (agent sessions, dev
# servers) fills that: systemd-oomd reaches its 90% swap limit and kills a
# whole app scope. Those heaps compress about 3:1 with zstd, so even a full 2x
# device occupies roughly two thirds of RAM, and oomd's PSI rule still ends
# real thrashing.
[zram0]
zram-size = ram * 2
