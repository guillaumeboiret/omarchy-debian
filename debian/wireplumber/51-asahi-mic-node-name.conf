# asahi-audio's microphone DSP (/usr/share/asahi-audio/*/mic*.json) captures from
# target.object = "alsa_input.platform-snd_soc_apple_aop.N.auto.HiFi__Mic__source",
# the name the Arch/Fedora Asahi kernels give the AOP microphone array. Debian's
# Asahi kernel names the same platform device "audio.N.auto", so that target never
# exists and WirePlumber links the DSP to the *default* source instead. Once the
# default is the stereo mapping omarchy_asahi_mic (built on the DSP's output), the
# DSP records itself: a silent loop, and dictation gets "No audio was captured".
# Give the array the name asahi-audio expects.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.platform-audio.1.auto.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-snd_soc_apple_aop.1.auto.HiFi__Mic__source"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-audio.2.auto.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-snd_soc_apple_aop.2.auto.HiFi__Mic__source"
      }
    }
  }
]
