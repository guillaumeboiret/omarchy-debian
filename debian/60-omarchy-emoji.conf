<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Omarchy (Debian port): colour emoji come before DejaVu's monochrome ones in every fallback
     chain, as Arch's noto-fonts-emoji does. Text fonts stay first, so digits remain text. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
